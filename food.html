<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burgers.jpeg" alt="Burgers, fries and fried chicken" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers, fries and fried chicken"
          />
          Burgers and fried chicken</label
        >
      </div>
      <div class="food-item">
        <img src="food/Tacos.jpeg" alt="Tacos" />
        <label
          ><input type="checkbox" name="food" value="Tacos" /> Tacos</label
        >
      </div>
      <div class="food-item">
        <img src="food/koreanfood.jpeg" alt="koreanfood" />
        <label
          ><input type="checkbox" name="food" value="Korean food" /> Korean
          food</label
        >
      </div>
      <div class="food-item">
        <img src="food/pasta.jpeg" alt="pasta" />
        <label><input type="checkbox" name="food" value="pasta" /> pasta</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> pizza</label>
      </div>
      <div class="food-item">
        <img src="food/salad.jpeg" alt="salad" />
        <label><input type="checkbox" name="food" value="salad" /> salad</label>
      </div>
      <div class="food-item">
        <img src="food/steak.jpeg" alt="steak" />
        <label><input type="checkbox" name="food" value="steak" /> steak</label>
      </div>
      <div class="food-item">
        <img src="food/sushi.jpeg" alt="sushi" />
        <label><input type="checkbox" name="food" value="sushi" /> sushi</label>
      </div>
      <div class="food-item">
        <img src="food/pho.jpg" alt="Pho" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="pho"
          />
          Pho</label
        >
      </div>
      <div class="food-item">
        <img src="food/comtam.jpg" alt="ComTam" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="ComTam"
          />
          Com Tam</label
        >
      </div>
      <div class="food-item">
        <img src="food/Bunbo.jpg" alt="Vietnamese Spice Beef Noodles" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Vietnamese Spice Beef Noodles"
          />
          Bun Bo Hue</label
        >
      </div>
      <div class="food-item">
        <img src="food/Banhxeo.jpeg" alt="Vietnamese Crepe" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Vietnamese Crepe"
          />
          Banh Xeo</label
        >
      </div>
      <div class="food-item">
        <img src="food/Thaifood.jpg" alt="Thai food" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Thai food"
          />
          Thai food</label
        >
      </div>
      <div class="food-item">
        <img src="food/food.jpg" alt="food" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="food"
          />
          Other food (You pick)</label
        >
      </div>
    </div>
   <button class="button" onclick="saveFood()">
  Click here to continue!
</button>


<script>
  function saveFood() {
    const checked = document.querySelectorAll('input[name="food"]:checked');
    if (checked.length === 0) {
      alert("Please select at least one food option 😡");
      return;
    }

    let foods = [];

    checked.forEach((item) => {
      foods.push(item.value);
    });

    localStorage.setItem("foods", foods.join(", "));
    window.location.href = "dessert.html";
  }
</script>

  </body>
</html>
