<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activities</title>
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>What are we doing before/after?</b></div>
    <div class="activities-selection">
      <div class="activity-item">
        <img src="activities/aquarium.jpeg" alt="Aquarium" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="aquarium"
          />Aquarium</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/arcade.jpeg" alt="Arcade" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="arcade"
          />Arcade</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/cinema.jpg" alt="Cinema" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="cinema"
          />Cinema</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/zoo.jpg" alt="Zoo" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="zoo"
          />Zoo</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/kunsthalle.jpeg" alt="Museum" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="museum"
          />Museum</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/park.jpeg" alt="Park.jpeg" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="park.jpeg"
          />Park</label
        >
      </div>
      <div class="activity-item">
        <img src="activities/Activities.jpg" alt="Activities.jpeg" />
        <label
          ><input
            type="checkbox"
            name="activities"
            value="Activities.jpeg"
          />Other options (You suggest)</label
        >
      </div>
    </div>
    <button class="button" onclick="saveActivities()">
  Last page
</button>

<script>
  function saveActivities() {
    const checked = document.querySelectorAll('input[name="activities"]:checked');
    if (checked.length === 0) {
      alert("Please select at least one option 😡");
      return;
    }
    let activities = [];

    checked.forEach((item) => {
      activities.push(item.value);
    });

    localStorage.setItem("activities", activities.join(", "));
    window.location.href = "lastpage.html";
  }
</script>
  </body>
</html>
