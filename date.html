<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date</title>
    <link rel="stylesheet" href="css/date.css" />
  </head>
  <body>
    <h1 title="choose a date">Are you free on ...?</h1>
    <form class="form-group">
      <label>Which day: (Please select a date)</label>
      <div>
        <input type="date" id="selectedDate" />
        <button class="button" type="button" onclick="saveDate()">
          Submit
        </button>
      </div>
    </form>

    <script>
      function saveDate() {
        const dateInput = document.getElementById("selectedDate");
        const dateValue = dateInput.value;

        if (!dateValue) {
          alert("Please select a date ❤️");
          return;
        }

        localStorage.setItem("selectedDate", dateValue);
        window.location.href = "food.html";
      }
    </script>
  </body>
</html>
