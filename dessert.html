<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dessert</title>
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion">Which dessert would you like to eat?</div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/boba.jpeg" alt="Boba" />
        <label
          ><input type="checkbox" name="dessert" value="boba" /> Boba</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/churro.jpeg" alt="Churro" />
        <label
          ><input type="checkbox" name="dessert" value="churro" /> Churro</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/che.jpg" alt="che" />
        <label><input type="checkbox" name="dessert" value="che" /> Che</label>
      </div>
      <div class="dessert-item">
        <img src="food/mochi.jpg" alt="mochi" />
        <label
          ><input type="checkbox" name="dessert" value="mochi" /> Mochi</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/Milktea.jpg" alt="Milktea" />
        <label
          ><input type="checkbox" name="dessert" value="Milktea" /> Milktea</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/taiyaki.jpeg" alt="Ice cream" />
        <label
          ><input type="checkbox" name="dessert" value="Ice cream" />
          Ice cream</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/Tiramisu.png" alt="Tiramisu" />
        <label
          ><input type="checkbox" name="dessert" value="Tiramisu" />
          Tiramisu</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/Boostjuice.jpg" alt="Boostjuice" />
        <label
          ><input type="checkbox" name="dessert" value="Boostjuice" />
          Boost</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/Desserts.jpg" alt="Desserts" />
        <label
          ><input type="checkbox" name="dessert" value="Desserts" />
          Other desserts (You pick)</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='activities.html'">
      Click here to continue!
    </button>
  </body>
</html>
