<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>Will you be my valentine?</b></div>
     <button class="answerButton" onclick="acceptValentine()">
    Yes
  </button>
    <button class="answerButton" id="noButton">No</button>
    <br />
    <img src="please.gif" alt="cat asking question" class="responsive" />

     <script>
    function acceptValentine() {
      localStorage.setItem("valentineAnswer", "Yes ❤️");
      window.location.href = "thankyou.html";
    }

    document
      .getElementById("noButton")
      .addEventListener("click", function () {
        var yesButton = document.querySelector(
          'button[onclick*="acceptValentine"]'
        );
        var currentFontSize = parseInt(
          window.getComputedStyle(yesButton).fontSize
        );
        yesButton.style.fontSize = currentFontSize + 10 + "px";
      });
  </script>
  </body>
</html>
